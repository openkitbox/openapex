[package]
name = "ox-db"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# `fts` is required: the mc_*_fts virtual tables are created through it.
# Default features stay off so the driver never installs its own mimalloc
# global allocator over the binary's.
turso = { workspace = true, features = ["fts"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
