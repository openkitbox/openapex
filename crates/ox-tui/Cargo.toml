[package]
name = "ox-tui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ox-tui"
path = "src/main.rs"

[dependencies]
ox-client = { path = "../ox-client" }
ox-schema = { path = "../ox-schema" }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["bracketed-paste"] }
tui-textarea = { version = "0.7", default-features = false, features = ["crossterm"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
serde_json = "1.0"
textwrap = "0.16"
unicode-width = "0.2"
tracing = "0.1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time"] }
