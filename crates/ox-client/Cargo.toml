[package]
name = "ox-client"
version = "0.1.0"
edition = "2024"

[dependencies]
ox-schema = { path = "../ox-schema" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
