[package]
name = "ox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12"
dashmap = "6.2.1"
dirs = "7.0.0"
futures-core = "0.3"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
salvo = { version = "1.0.1", features = ["server", "http1", "http2", "sse", "affix-state", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
thiserror = "2"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rusqlite = "0.8.0"
tokio-util = "0.7"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "time"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
futures-core = "0.3"
