[workspace]
members = [
  "crates/ox-acp",
  "crates/ox-core",
  "crates/ox-db",
  "crates/ox-engine",
  "crates/ox-llm",
  "crates/ox-mcp",
  "crates/ox-schema",
  "crates/ox-server",
  "crates/ox-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Single source of truth for third-party versions. Members inherit with
# `dependency.workspace = true` and add only their own features, so a version
# bump touches exactly one file.
[workspace.dependencies]
anyhow = "1.0"
base64 = "0.23"
bytes = "1.12"
dashmap = "6.2.1"
dirs = "7.0.0"
futures-core = "0.3"
futures-util = "0.3"
git2 = { version = "0.21", default-features = false }
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
jiff = "0.2"
libc = "0.2"
# ox declares the global allocator itself (src/main.rs), so turso's default
# "mimalloc" feature — which would install its own — stays disabled. The
# no_thp feature rides on the same libmimalloc-sys build.
rustfs-mimalloc = { version = "0.7", features = ["no_thp"] }
ox-acp = { path = "crates/ox-acp" }
ox-core = { path = "crates/ox-core" }
ox-db = { path = "crates/ox-db" }
ox-engine = { path = "crates/ox-engine" }
ox-llm = { path = "crates/ox-llm" }
ox-mcp = { path = "crates/ox-mcp" }
ox-schema = { path = "crates/ox-schema" }
ox-server = { path = "crates/ox-server" }
ox-tools = { path = "crates/ox-tools" }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
salvo = "1.0"
serde = "1.0"
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
tokio = "1.53"
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3"
url = "2"

[package]
name = "ox"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ox"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The façade re-exports every crate so `ox::…` stays one import path for
# tests and the binary; the binary itself needs only a few of these.
ox-acp.workspace = true
ox-core.workspace = true
ox-db.workspace = true
ox-engine.workspace = true
ox-llm.workspace = true
ox-mcp.workspace = true
ox-schema.workspace = true
ox-server.workspace = true
ox-tools.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "time"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rustfs-mimalloc.workspace = true

[dev-dependencies]
ox-db.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }

# Single codegen unit lets the optimizer see across the ten crates (the
# step loop and the projector cross crate boundaries on their hot paths), and
# stripping symbols keeps the release artefact small.
# Panics still unwind: the server recovers poisoned locks and tool tasks are
# isolated by `tokio::spawn`, both of which `panic = "abort"` would defeat.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.clippy]
result_large_err = "allow"
wildcard_imports = "warn"
unwrap_used = "warn"
len_without_is_empty = "warn"
must_use_candidate = "warn"
undocumented_unsafe_blocks = "warn"

[lints]
workspace = true
