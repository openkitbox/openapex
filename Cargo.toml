[workspace]
members = [
  "crates/ox-acp",
  "crates/ox-client",
  "crates/ox-core",
  "crates/ox-db",
  "crates/ox-engine",
  "crates/ox-llm",
  "crates/ox-mcp",
  "crates/ox-schema",
  "crates/ox-server",
  "crates/ox-tools",
  "crates/ox-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Single source of truth for third-party versions. Members inherit with
# `dependency.workspace = true` and add only their own features, so a version
# bump touches exactly one file.
[workspace.dependencies]
anyhow = "1.0"
agent-client-protocol = { version = "3.5" }
base64 = "0.23"
bytes = "1.12"
crossterm = "0.29"
dashmap = "6.2.1"
dirs = "7.0.0"
futures-core = "0.3"
futures-util = "0.3"
git2 = { version = "0.21", default-features = false }
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
jiff = "0.2"
libc = "0.2"
# ox declares the global allocator itself (src/main.rs), so turso's default
# "mimalloc" feature — which would install its own — stays disabled. The
# no_thp feature rides on the same libmimalloc-sys build.
rustfs-mimalloc = { version = "0.7", features = ["no_thp"] }
ox-client = { path = "crates/ox-client" }
ox-acp = { path = "crates/ox-acp" }
ox-core = { path = "crates/ox-core" }
ox-db = { path = "crates/ox-db" }
ox-engine = { path = "crates/ox-engine" }
ox-llm = { path = "crates/ox-llm" }
ox-mcp = { path = "crates/ox-mcp" }
ox-schema = { path = "crates/ox-schema" }
ox-server = { path = "crates/ox-server" }
ox-tools = { path = "crates/ox-tools" }
ox-tui = { path = "crates/ox-tui" }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
salvo = "1.0"
serde = "1.0"
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
textwrap = "0.16"
thiserror = "2"
tokio = "1.53"
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3"
unicode-width = "0.2"
url = "2"

[patch.crates-io]
# Every turso crate must come from the fork at one rev: the crates.io
# turso_sdk_kit calls DatabaseOpts methods that the fork's newer core removed.
turso = { git = "https://github.com/openkitbox/turso", branch = "ox" }
turso_core = { git = "https://github.com/openkitbox/turso", branch = "ox" }
turso_ext = { git = "https://github.com/openkitbox/turso", branch = "ox" }
turso_macros = { git = "https://github.com/openkitbox/turso", branch = "ox" }
turso_parser = { git = "https://github.com/openkitbox/turso", branch = "ox" }
turso_sdk_kit = { git = "https://github.com/openkitbox/turso", branch = "ox" }
turso_sdk_kit_macros = { git = "https://github.com/openkitbox/turso", branch = "ox" }
turso_sync_engine = { git = "https://github.com/openkitbox/turso", branch = "ox" }
turso_sync_sdk_kit = { git = "https://github.com/openkitbox/turso", branch = "ox" }

[package]
name = "ox"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ox"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The façade re-exports every crate so `ox::…` stays one import path for
# tests and the binary; the binary itself needs only a few of these.
ox-acp.workspace = true
ox-core.workspace = true
ox-db.workspace = true
ox-engine.workspace = true
ox-llm.workspace = true
ox-mcp.workspace = true
ox-schema.workspace = true
ox-server.workspace = true
ox-tools.workspace = true
ox-tui.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "time"] }
rustfs-mimalloc.workspace = true

[dev-dependencies]
base64.workspace = true
bytes.workspace = true
serde = { workspace = true, features = ["derive"] }
futures-core.workspace = true
reqwest.workspace = true
ox-db.workspace = true
salvo = { workspace = true, features = ["server", "http1", "http2", "sse", "affix-state", "logging"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }

[workspace.lints.clippy]
result_large_err = "allow"

[lints]
workspace = true
