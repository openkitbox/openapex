[package]
name = "ox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
rand = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
salvo = { version = "1.0.1", features = ["server", "http1", "http2", "sse", "affix-state", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-rusqlite = "0.8.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "time"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
