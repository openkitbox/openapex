[workspace]
members = [
  "crates/ox-acp",
  "crates/ox-client",
  "crates/ox-core",
  "crates/ox-db",
  "crates/ox-engine",
  "crates/ox-mcp",
  "crates/ox-schema",
  "crates/ox-server",
  "crates/ox-tools",
  "crates/ox-tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Single source of truth for third-party versions. Members inherit with
# `dependency.workspace = true` and add only their own features, so a version
# bump touches exactly one file.
[workspace.dependencies]
anyhow = "1.0"
agent-client-protocol = { version = "3.5" }
base64 = "0.23"
bytes = "1.12"
cortexkit-cache-core = { git = "https://github.com/openkitbox/commons", rev = "067701f1ab61cd2c81aa58fb66b0cb65fbaef9e7" }
crossterm = "0.28"
dashmap = "6.2.1"
dirs = "7.0.0"
flume = "0.12"
futures-core = "0.3"
futures-util = "0.3"
git2 = { version = "0.21", default-features = false }
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
jiff = "0.2"
libc = "0.2"
# ox declares the global allocator itself (src/main.rs), so turso's default
# "mimalloc" feature — which would install its own — stays disabled. The
# no_thp feature rides on the same libmimalloc-sys build.
rustfs-mimalloc = { version = "0.7", features = ["no_thp"] }
ox-client = { path = "crates/ox-client" }
ox-acp = { path = "crates/ox-acp" }
ox-core = { path = "crates/ox-core" }
ox-db = { path = "crates/ox-db" }
ox-engine = { path = "crates/ox-engine" }
ox-mcp = { path = "crates/ox-mcp" }
ox-schema = { path = "crates/ox-schema" }
ox-server = { path = "crates/ox-server" }
ox-tools = { path = "crates/ox-tools" }
ox-tui = { path = "crates/ox-tui" }
# Shell engine: omp's pi-shell (brush-based). The pinned rev is the only
# supported update path; bump it deliberately and re-run the shell corpus A/B.
pi-shell = { git = "https://github.com/openkitbox/oh-my-pi", rev = "2220e58146ebe31508e7a216242840d373e082d0" }
rand = "0.10"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
# mctx/tokens.rs: the Kimi BPE is built through tiktoken-rs' public
# CoreBPE::new (patched_tiktoken.rs @ v0.12.1); `rustc-hash` must match the
# version tiktoken-rs 0.12 uses — its FxHashMap is the constructor's parameter
# type. tokenizers is pinned to the onig backend: the only feature that
# selects a non-onig regex engine is `unstable_wasm`, and onig is the engine
# the golden oracle was generated with.
rustc-hash = "2"
salvo = "1.0"
serde = "1.0"
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
tempfile = "3"
textwrap = "0.16"
thiserror = "2"
tokio = "1.53"
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
tui-textarea = { version = "0.7", default-features = false }
turso = { version = "=0.9.0-pre.1", default-features = false }
unicode-width = "0.2"

# pi-builtins and the vendored brush-core pull brush-core/brush-parser from
# crates.io; omp redirects those to its vendored forks at the workspace root.
# Patches are only honored from the top-level workspace, so ox must repeat them
# or the graph would mix the crates.io brush with the fork.
[patch.crates-io]
brush-core = { git = "https://github.com/openkitbox/oh-my-pi", rev = "2220e58146ebe31508e7a216242840d373e082d0" }
brush-parser = { git = "https://github.com/openkitbox/oh-my-pi", rev = "2220e58146ebe31508e7a216242840d373e082d0" }

[package]
name = "ox"
version.workspace = true
edition.workspace = true

[[bin]]
name = "opencode-rs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The façade re-exports every crate so `ox::…` stays one import path for
# tests and the binary; the binary itself needs only a few of these.
ox-acp.workspace = true
ox-core.workspace = true
ox-db.workspace = true
ox-engine.workspace = true
ox-mcp.workspace = true
ox-schema.workspace = true
ox-server.workspace = true
ox-tools.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "time"] }
rustfs-mimalloc.workspace = true

[dev-dependencies]
base64.workspace = true
bytes.workspace = true
serde = { workspace = true, features = ["derive"] }
futures-core.workspace = true
reqwest.workspace = true
ox-db.workspace = true
salvo = { workspace = true, features = ["server", "http1", "http2", "sse", "affix-state", "logging"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true

[workspace.lints.clippy]
result_large_err = "allow"

# The shell engine (pi-builtins' grep-pcre2) and libgit2-sys' bundled PCRE2
# (both hardwired in their build scripts, neither exposes a feature to drop
# it) export the same `__pcre2_*` C symbols into one binary. ox uses each
# through disjoint paths (shell `grep -P` vs. libgit2 repo discovery only),
# so the duplicated tables are harmless; rustc relays ld's complaint about
# them as linker-messages warnings, which are pure build noise here. Errors
# from the linker still fail the build — only the relayed warnings are muted.
[workspace.lints.rust]
linker_messages = "allow"

[lints]
workspace = true
